name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake make

      - name: Configure (CMake)
        run: rm -rf build && cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test — Lexer
        run: ./build/test_lexer

      - name: Test — Parser
        run: ./build/test_parser

      - name: Test — Analyzer
        run: ./build/test_analyzer

      - name: Test — CodeGen + VM
        run: ./build/test_codegen
